<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#f6f6f6"/>
  
  <!-- Concentric Ripples -->
  <circle cx="260" cy="200" r="40" fill="none" stroke="#404040" stroke-width="2"/>
  <circle cx="260" cy="200" r="90" fill="none" stroke="#a3a3a3" stroke-width="2"/>
  <circle cx="260" cy="200" r="150" fill="none" stroke="#e5e5e5" stroke-width="2"/>
  <circle cx="260" cy="200" r="220" fill="none" stroke="#e5e5e5" stroke-width="2"/>
  
  <!-- Sharp Piercing Diamonds -->
  <polygon points="540,100 620,180 540,260 460,180" fill="#404040"/>
  <polygon points="660,180 720,240 660,300 600,240" fill="#737373" stroke="#f6f6f6" stroke-width="4"/>
  
  <!-- Linear Flow -->
  <line x1="260" y1="200" x2="480" y2="200" stroke="#404040" stroke-width="3"/>
  <polyline points="460,190 480,200 460,210" fill="none" stroke="#404040" stroke-width="3"/>
  
  <!-- Subtle Squiggle inside the ripple -->
  <path d="M 180 200 Q 220 160 260 200 T 340 200" fill="none" stroke="#737373" stroke-width="2"/>
</svg>

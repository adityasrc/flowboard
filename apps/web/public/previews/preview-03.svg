<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#f6f6f6"/>
  
  <!-- Rigid Rectangles -->
  <rect x="140" y="120" width="120" height="80" rx="6" fill="#e5e5e5" stroke="#404040" stroke-width="2"/>
  <rect x="360" y="180" width="100" height="120" rx="8" fill="#404040"/>
  <rect x="560" y="100" width="140" height="60" rx="4" fill="#a3a3a3"/>
  
  <!-- Wild Overlapping Squiggles -->
  <path d="M 80 180 C 180 80 250 280 350 120 C 450 -40 450 320 600 180 C 680 100 700 300 750 220" fill="none" stroke="#404040" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Minor annotations and connections -->
  <circle cx="200" cy="160" r="12" fill="#737373"/>
  <circle cx="630" cy="130" r="10" fill="#e5e5e5"/>
  
  <line x1="260" y1="160" x2="360" y2="220" stroke="#a3a3a3" stroke-width="3" stroke-dasharray="6,6"/>
  <polyline points="340,215 360,220 350,205" fill="none" stroke="#a3a3a3" stroke-width="3"/>
  
  <line x1="460" y1="240" x2="580" y2="160" stroke="#404040" stroke-width="2"/>
</svg>

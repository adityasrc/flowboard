<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#f6f6f6"/>
  
  <!-- Network Nodes (Circles and Diamonds) -->
  <circle cx="160" cy="100" r="15" fill="#a3a3a3" stroke="#404040" stroke-width="2"/>
  <circle cx="300" cy="140" r="10" fill="#404040"/>
  <polygon points="440,80 470,110 440,140 410,110" fill="#e5e5e5" stroke="#404040" stroke-width="2"/>
  <circle cx="600" cy="100" r="12" fill="#737373" stroke="#404040" stroke-width="2"/>
  
  <polygon points="200,240 240,280 200,320 160,280" fill="none" stroke="#404040" stroke-width="2"/>
  <circle cx="340" cy="280" r="15" fill="#e5e5e5" stroke="#404040" stroke-width="2"/>
  <circle cx="480" cy="240" r="10" fill="#a3a3a3"/>
  <rect x="620" y="260" width="60" height="60" rx="4" fill="#737373"/>
  
  <!-- Interconnecting Grid Lines -->
  <line x1="160" y1="100" x2="600" y2="100" stroke="#404040" stroke-width="1.5"/>
  <line x1="300" y1="140" x2="340" y2="280" stroke="#404040" stroke-width="1.5"/>
  <line x1="440" y1="110" x2="200" y2="280" stroke="#404040" stroke-width="1.5"/>
  <line x1="600" y1="100" x2="650" y2="260" stroke="#404040" stroke-width="1.5"/>
  <line x1="200" y1="280" x2="620" y2="280" stroke="#404040" stroke-width="1.5"/>
  <line x1="440" y1="110" x2="480" y2="240" stroke="#404040" stroke-width="1.5"/>
</svg>

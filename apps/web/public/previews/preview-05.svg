<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#f6f6f6"/>
  
  <!-- Left Side: Heavy and Solid -->
  <rect x="80" y="80" width="220" height="240" rx="12" fill="#e5e5e5"/>
  <rect x="100" y="100" width="180" height="200" rx="8" fill="#404040"/>
  <rect x="130" y="130" width="120" height="20" fill="#f6f6f6"/>
  <circle cx="190" cy="220" r="30" fill="#f6f6f6"/>
  
  <!-- Sharp Arrow pointing right -->
  <line x1="300" y1="200" x2="480" y2="200" stroke="#404040" stroke-width="4"/>
  <polyline points="460,180 480,200 460,220" fill="none" stroke="#404040" stroke-width="4"/>
  
  <!-- Right Side: Chaotic and Light -->
  <g transform="translate(600, 150) rotate(-10)">
    <polygon points="0,0 40,40 0,80 -40,40" fill="none" stroke="#404040" stroke-width="2"/>
  </g>
  <circle cx="650" cy="180" r="50" fill="none" stroke="#404040" stroke-width="2" stroke-dasharray="8,8"/>
  <g transform="translate(620, 250) rotate(15)">
    <rect x="-30" y="-30" width="60" height="60" fill="#a3a3a3" stroke="#404040" stroke-width="2"/>
  </g>
  
  <path d="M 520 100 Q 550 50 600 90 T 680 60" fill="none" stroke="#404040" stroke-width="2"/>
  <path d="M 550 300 Q 600 340 650 310 T 730 330" fill="none" stroke="#a3a3a3" stroke-width="2"/>
  
  <circle cx="560" cy="160" r="10" fill="#e5e5e5"/>
</svg>

<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#f6f6f6"/>
  
  <!-- Massive Central Light Circle -->
  <circle cx="400" cy="200" r="140" fill="none" stroke="#e5e5e5" stroke-width="6"/>
  <circle cx="400" cy="200" r="130" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-dasharray="15,10"/>
  
  <!-- Orbiting "Moons" -->
  <circle cx="270" cy="110" r="25" fill="#404040"/>
  <rect x="520" y="80" width="80" height="40" rx="4" fill="#a3a3a3" stroke="#404040" stroke-width="2" transform="rotate(30 560 100)"/>
  <polygon points="560,260 600,300 560,340 520,300" fill="#e5e5e5" stroke="#404040" stroke-width="2"/>
  <rect x="180" y="270" width="100" height="60" rx="4" fill="#737373"/>

  <!-- Orbital Paths & Arrows -->
  <path d="M 230 150 C 180 200 180 300 230 350" fill="none" stroke="#404040" stroke-width="2" stroke-linecap="round"/>
  <polyline points="230,335 230,350 215,345" fill="none" stroke="#404040" stroke-width="2"/>
  
  <path d="M 570 150 C 620 200 620 300 570 350" fill="none" stroke="#404040" stroke-width="2" stroke-linecap="round"/>
  <polyline points="570,165 570,150 585,155" fill="none" stroke="#404040" stroke-width="2"/>
  
  <!-- Pencil Squiggle outside orbit -->
  <path d="M 50 50 Q 100 20 150 70 T 250 50" fill="none" stroke="#e5e5e5" stroke-width="3" stroke-linecap="round"/>
</svg>

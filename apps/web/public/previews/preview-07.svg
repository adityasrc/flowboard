<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#f6f6f6"/>
  
  <!-- Nodes (Light and Mid Gray Fills) -->
  <circle cx="150" cy="100" r="50" fill="#e5e5e5" stroke="#404040" stroke-width="2"/>
  <rect x="280" y="120" width="140" height="100" rx="6" fill="#a3a3a3" stroke="#404040" stroke-width="2"/>
  <polygon points="490,190 560,260 490,330 420,260" fill="none" stroke="#404040" stroke-width="2"/>
  <rect x="580" y="250" width="160" height="100" rx="6" fill="#e5e5e5" stroke="#404040" stroke-width="2"/>
  
  <!-- "Dark" Cascading Rectangles -->
  <rect x="180" y="70" width="30" height="30" fill="#404040"/>
  <rect x="420" y="160" width="20" height="20" fill="#404040"/>
  <circle cx="560" cy="320" r="15" fill="#404040"/>
  
  <!-- Connections (Arrows) -->
  <line x1="190" y1="130" x2="285" y2="155" stroke="#404040" stroke-width="3"/>
  <polyline points="275,145 285,155 270,165" fill="none" stroke="#404040" stroke-width="3"/>
  
  <path d="M 400 220 Q 450 260 475 260" fill="none" stroke="#404040" stroke-width="3"/>
  <polyline points="465,250 475,260 460,270" fill="none" stroke="#404040" stroke-width="3"/>
  
  <line x1="560" y1="260" x2="620" y2="280" stroke="#404040" stroke-width="3" stroke-dasharray="6,6"/>
  
  <!-- Top Right and Bottom Left Squiggles for Balance -->
  <path d="M 600 50 Q 650 20 700 60 T 780 40" fill="none" stroke="#e5e5e5" stroke-width="2"/>
  <path d="M 50 300 Q 100 340 150 310" fill="none" stroke="#404040" stroke-width="2"/>
</svg>

<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#f6f6f6"/>
  
  <!-- Underlying Spiderweb/Lines -->
  <line x1="120" y1="140" x2="300" y2="80" stroke="#a3a3a3" stroke-width="1.5"/>
  <line x1="120" y1="140" x2="240" y2="260" stroke="#a3a3a3" stroke-width="1.5"/>
  <line x1="300" y1="80" x2="480" y2="160" stroke="#a3a3a3" stroke-width="1.5"/>
  <line x1="240" y1="260" x2="480" y2="160" stroke="#a3a3a3" stroke-width="1.5"/>
  <line x1="480" y1="160" x2="680" y2="120" stroke="#404040" stroke-width="2"/>
  <line x1="480" y1="160" x2="600" y2="300" stroke="#404040" stroke-width="2"/>
  <line x1="680" y1="120" x2="600" y2="300" stroke="#a3a3a3" stroke-width="1.5"/>
  <line x1="240" y1="260" x2="400" y2="340" stroke="#a3a3a3" stroke-width="1.5"/>
  <line x1="600" y1="300" x2="400" y2="340" stroke="#a3a3a3" stroke-width="1.5"/>
  
  <!-- Major Nodes -->
  <circle cx="480" cy="160" r="35" fill="#404040"/>
  <polygon points="240,230 270,260 240,290 210,260" fill="#e5e5e5" stroke="#404040" stroke-width="2"/>
  <rect x="650" y="90" width="60" height="60" rx="4" fill="#a3a3a3"/>
  
  <!-- Minor Nodes -->
  <circle cx="120" cy="140" r="15" fill="#737373"/>
  <circle cx="300" cy="80" r="20" fill="#e5e5e5" stroke="#404040" stroke-width="2"/>
  <circle cx="600" cy="300" r="25" fill="#737373"/>
  <circle cx="400" cy="340" r="15" fill="#404040"/>
  
  <!-- Dynamic Arrows pushing out of network -->
  <path d="M 520 160 Q 600 200 680 220" fill="none" stroke="#404040" stroke-width="2"/>
  <polyline points="665,210 680,220 670,235" fill="none" stroke="#404040" stroke-width="2"/>
</svg>

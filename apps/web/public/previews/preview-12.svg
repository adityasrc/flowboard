<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#f6f6f6"/>
  
  <!-- Kanban Columns (Overlapping) -->
  <rect x="100" y="80" width="160" height="240" rx="8" fill="#e5e5e5" stroke="#404040" stroke-width="2"/>
  <rect x="320" y="60" width="160" height="280" rx="8" fill="none" stroke="#404040" stroke-width="2"/>
  <rect x="540" y="100" width="160" height="200" rx="8" fill="#a3a3a3" stroke="#404040" stroke-width="2"/>
  
  <!-- Internal Indicators (Circles) -->
  <circle cx="230" cy="110" r="12" fill="#737373"/>
  <circle cx="230" cy="140" r="12" fill="#737373"/>
  <circle cx="450" cy="90" r="12" fill="#404040"/>
  
  <!-- Horizontal Flow Arrow -->
  <line x1="80" y1="200" x2="720" y2="200" stroke="#404040" stroke-width="3" stroke-dasharray="10,10"/>
  <polyline points="705,190 720,200 705,210" fill="none" stroke="#404040" stroke-width="3"/>
  
  <!-- Pencil Annotation Squiggle -->
  <path d="M 600 320 Q 640 350 680 320 T 740 340" fill="none" stroke="#404040" stroke-width="2"/>
</svg>
